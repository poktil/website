
<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Poktil — Toza til, madaniyatli muloqot</title>
    <base target="_blank" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --header-h: 100px;
        --neon-sky: #0ea5e9;
        --neon-purple: #a855f7;
      }
      @media (max-width: 768px) {
        :root {
          --header-h: 80px;
        }
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
      }
      h1, h2, h3, .font-space {
        font-family: 'Space Grotesk', sans-serif;
      }
      .snap-container {
        scroll-snap-type: y mandatory;
        height: 100dvh;
        overflow-y: auto;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
      .snap-section {
        scroll-snap-align: start;
        scroll-snap-stop: always;
        height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        padding-top: var(--header-h);
        position: relative;
        overflow: hidden;
      }
      .snap-container::-webkit-scrollbar {
        display: none;
      }
      .snap-container {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .neon-text {
        text-shadow: 0 0 10px rgba(14, 165, 233, 0.5), 0 0 20px rgba(14, 165, 233, 0.3);
      }
      .glass {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      .grain {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.02;
        pointer-events: none;
        z-index: 100;
      }
      .snap-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-height: calc(100dvh - var(--header-h));
      }
      button:focus-visible {
        outline: 2px solid var(--neon-sky);
        outline-offset: 4px;
      }
      /* Extreme rounding utility */
      .rounded-extreme {
        border-radius: 4rem;
      }
      @media (max-width: 768px) {
        .rounded-extreme {
          border-radius: 2.5rem;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-950 text-slate-100">
    <div class="grain"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
